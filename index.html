<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModReply - Macro Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 15px;
            color: #fff;
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .logo {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #5B7FFF 0%, #3B5FFF 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .header-title p {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
        }

        /* ── CATEGORIES ── */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .category-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #aaa;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: all 0.3s;
            font-weight: 500;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #5B7FFF 0%, #3B5FFF 100%);
            color: white;
            border-color: #5B7FFF;
        }

        .category-btn:hover {
            background: rgba(91, 127, 255, 0.2);
            border-color: #5B7FFF;
        }

        .badge {
            display: inline-block;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
        }

        /* ── MACRO CARDS ── */
        .macros-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 80px;
        }

        .macro-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .macro-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .macro-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .macro-name {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .category-label {
            font-size: 11px;
            background: rgba(91, 127, 255, 0.3);
            color: #5B7FFF;
            padding: 3px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .macro-content {
            font-size: 13px;
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .macro-actions {
            display: flex;
            gap: 8px;
        }

        .btn-copy {
            flex: 1;
            background: rgba(91, 127, 255, 0.3);
            color: #5B7FFF;
            border: 1px solid #5B7FFF;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-copy:hover {
            background: #5B7FFF;
            color: white;
        }

        .btn-copy.copied {
            background: #2ed573;
            color: white;
            border-color: #2ed573;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-delete {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #ff4757;
            color: white;
        }

        /* ── SEARCH BAR ── */
        .search-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 16px;
            border-radius: 25px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input::placeholder {
            color: #888;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #5B7FFF;
        }

        /* ── FLOATING ADD BUTTON ── */
        .btn-add {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #5B7FFF 0%, #3B5FFF 100%);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(91, 127, 255, 0.4);
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .btn-add:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(91, 127, 255, 0.6);
        }

        .btn-add:active {
            transform: scale(0.95);
        }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: flex-end;
            z-index: 200;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #5B7FFF;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group select option {
            background: #1a1a2e;
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #5B7FFF 0%, #3B5FFF 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(91, 127, 255, 0.4);
        }

        .btn-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .search-container {
                padding: 12px;
            }

            .btn-add {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">⚡</div>
        <div class="header-title">
            <h1>ModReply</h1>
            <p>Save & search macros</p>
        </div>
    </div>

    <!-- Categories -->
    <div class="categories" id="categories"></div>

    <!-- Macros Container -->
    <div class="macros-container" id="macrosContainer">
        <div class="empty-state">
            <p>📭 No macros yet</p>
        </div>
    </div>

    <!-- Search Bar (Fixed at bottom) -->
    <div class="search-container">
        <input 
            type="text" 
            class="search-input" 
            id="searchInput" 
            placeholder="🔍 Search or type /shortcode..."
        >
        <button class="btn-add" onclick="openAddModal()">+</button>
    </div>

    <!-- Modal for Add/Edit -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Macro</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <div class="form-group">
                <label>Macro Name</label>
                <input type="text" id="macroName" placeholder="e.g., Opening Message">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="macroCategory">
                    <option value="Greeting">Greeting</option>
                    <option value="Closing">Closing</option>
                    <option value="KYC">KYC</option>
                    <option value="Support">Support</option>
                    <option value="Rules">Rules</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Content</label>
                <textarea id="macroContent" placeholder="Enter your macro text here..."></textarea>
            </div>

            <div class="modal-buttons">
                <button class="btn-submit" onclick="saveMacro()">Save</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'modreply_macros';
        let macros = [];
        let currentEditIndex = null;
        let currentCategory = 'All';

        // Load macros
        function loadMacros() {
            const stored = localStorage.getItem(STORAGE_KEY);
            macros = stored ? JSON.parse(stored) : [];
            renderCategories();
            renderMacros();
        }

        // Save to localStorage
        function saveMacrosToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(macros));
        }

        // Render categories
        function renderCategories() {
            const categories = ['All', ...new Set(macros.map(m => m.category))];
            const categoriesDiv = document.getElementById('categories');

            categoriesDiv.innerHTML = categories.map(cat => {
                const count = macros.filter(m => m.category === cat).length;
                const badge = count > 0 && cat !== 'All' ? `<span class="badge">${count}</span>` : '';
                return `
                    <button class="category-btn ${currentCategory === cat ? 'active' : ''}" 
                            onclick="filterByCategory('${cat}')">
                        ${cat}${badge}
                    </button>
                `;
            }).join('');
        }

        // Filter by category
        function filterByCategory(category) {
            currentCategory = category;
            renderCategories();
            renderMacros();
        }

        // Render macros
        function renderMacros() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = macros.filter(macro => {
                const matchesSearch = macro.name.toLowerCase().includes(searchTerm) || 
                                     macro.content.toLowerCase().includes(searchTerm);
                const matchesCategory = currentCategory === 'All' || macro.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            const container = document.getElementById('macrosContainer');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>📭 No macros found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((macro, index) => `
                <div class="macro-card">
                    <div class="macro-card-header">
                        <div class="macro-name">${macro.name}</div>
                        <div class="category-label">${macro.category}</div>
                    </div>
                    <div class="macro-content">${macro.content}</div>
                    <div class="macro-actions">
                        <button class="btn-copy" onclick="copyMacro('${macro.name}', ${macros.indexOf(macro)})">📋 Copy</button>
                        <button class="btn-edit" onclick="openEditModal(${macros.indexOf(macro)})">Edit</button>
                        <button class="btn-delete" onclick="deleteMacro(${macros.indexOf(macro)})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Copy macro
        function copyMacro(name, index) {
            const text = macros[index].content;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                btn.textContent = '✅ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        // Open add modal
        function openAddModal() {
            currentEditIndex = null;
            document.getElementById('modalTitle').textContent = 'Add Macro';
            document.getElementById('macroName').value = '';
            document.getElementById('macroCategory').value = 'Greeting';
            document.getElementById('macroContent').value = '';
            document.getElementById('modal').classList.add('active');
        }

        // Open edit modal
        function openEditModal(index) {
            currentEditIndex = index;
            const macro = macros[index];
            document.getElementById('modalTitle').textContent = 'Edit Macro';
            document.getElementById('macroName').value = macro.name;
            document.getElementById('macroCategory').value = macro.category;
            document.getElementById('macroContent').value = macro.content;
            document.getElementById('modal').classList.add('active');
        }

        // Save macro
        function saveMacro() {
            const name = document.getElementById('macroName').value.trim();
            const category = document.getElementById('macroCategory').value;
            const content = document.getElementById('macroContent').value.trim();

            if (!name || !content) {
                alert('Please fill all fields!');
                return;
            }

            if (currentEditIndex !== null) {
                macros[currentEditIndex] = { name, category, content };
            } else {
                macros.push({ name, category, content });
            }

            saveMacrosToStorage();
            renderCategories();
            renderMacros();
            closeModal();
        }

        // Delete macro
        function deleteMacro(index) {
            if (confirm('Delete this macro?')) {
                macros.splice(index, 1);
                saveMacrosToStorage();
                renderCategories();
                renderMacros();
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentEditIndex = null;
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', renderMacros);

        // Close modal on overlay click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Initialize
        loadMacros();
    </script>

</body>
</html>
