<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModReply - Discord Moderator Template Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        /* ── FLOATING BUBBLE (FAB) ── */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2E86AB 0%, #1B5E75 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 134, 171, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
            border: none;
        }

        .fab:hover {
            width: 65px;
            height: 65px;
            box-shadow: 0 6px 20px rgba(46, 134, 171, 0.6);
            transform: scale(1.05);
        }

        .fab:active {
            transform: scale(0.95);
        }

        .fab-icon {
            font-size: 28px;
            color: white;
        }

        /* ── MODAL (Hidden by default) ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ── MODAL HEADER ── */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6B7280;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #1F2937;
        }

        /* ── SEARCH BAR ── */
        .search-bar {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            outline: none;
            border-color: #2E86AB;
            box-shadow: 0 0 0 3px rgba(46, 134, 171, 0.1);
        }

        /* ── MACRO LIST ── */
        .macro-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .macro-item {
            background: #F9FAFB;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #2E86AB;
            cursor: pointer;
            transition: all 0.2s;
        }

        .macro-item:hover {
            background: #F3F4F6;
            transform: translateX(4px);
        }

        .macro-name {
            font-weight: 600;
            color: #1F2937;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .macro-preview {
            color: #6B7280;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── COPY BUTTON ── */
        .copy-btn {
            background: #2E86AB;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
            width: 100%;
        }

        .copy-btn:hover {
            background: #1B5E75;
        }

        .copy-btn.copied {
            background: #10B981;
        }

        /* ── DEMO CONTENT ── */
        .demo-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .demo-content h2 {
            margin-bottom: 10px;
            color: #1F2937;
        }

        .demo-content p {
            color: #6B7280;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Demo Content -->
    <div class="demo-content">
        <h2>📌 ModReply</h2>
        <p>Click the blue bubble in the bottom right to open your saved macros!</p>
    </div>

    <!-- Floating Bubble (FAB) -->
    <button class="fab" id="fabBtn" title="Open ModReply">
        <span class="fab-icon">💬</span>
    </button>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">ModReply Macros</h2>
                <button class="modal-close" id="closeBtn">&times;</button>
            </div>

            <!-- Search Bar -->
            <input 
                type="text" 
                class="search-bar" 
                id="searchBar" 
                placeholder="Search macros... (type to filter)"
            >

            <!-- Macro List -->
            <div class="macro-list" id="macroList">
                <p style="color: #9CA3AF; text-align: center; padding: 20px;">
                    No macros yet. Add some to get started!
                </p>
            </div>
        </div>
    </div>

    <script>
        const fabBtn = document.getElementById('fabBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const searchBar = document.getElementById('searchBar');
        const macroList = document.getElementById('macroList');

        const STORAGE_KEY = 'modreply_macros';

        // Load macros from localStorage
        function loadMacros() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        // Save macros to localStorage
        function saveMacros(macros) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(macros));
        }

        let macros = loadMacros();

        // Open modal when bubble is clicked
        fabBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
            searchBar.focus();
        });

        // Close modal when X is clicked
        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Close modal when overlay background is clicked
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Render macros
        function renderMacros(macrosToShow) {
            if (macrosToShow.length === 0) {
                macroList.innerHTML = '<p style="color: #9CA3AF; text-align: center; padding: 20px;">No macros found.</p>';
                return;
            }

            macroList.innerHTML = macrosToShow.map((macro, index) => `
                <div class="macro-item">
                    <div class="macro-name">${macro.name}</div>
                    <div class="macro-preview">${macro.content}</div>
                    <button class="copy-btn" data-index="${index}">📋 Copy</button>
                </div>
            `).join('');

            // Add copy button listeners
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = btn.getAttribute('data-index');
                    const text = macrosToShow[index].content;
                    
                    navigator.clipboard.writeText(text).then(() => {
                        btn.textContent = '✅ Copied!';
                        btn.classList.add('copied');
                        setTimeout(() => {
                            btn.textContent = '📋 Copy';
                            btn.classList.remove('copied');
                        }, 2000);
                    });
                });
            });
        }

        // Search/filter macros
        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = macros.filter(macro => 
                macro.name.toLowerCase().includes(query) || 
                macro.content.toLowerCase().includes(query)
            );
            renderMacros(filtered);
        });

        // Add macro (simple prompt method)
        function addMacro() {
            const name = prompt('Macro name:');
            if (!name) return;
            const content = prompt('Macro content:');
            if (!content) return;
            macros.push({ name, content });
            saveMacros(macros);
            renderMacros(macros);
        }

        // Keyboard shortcut (Alt+M to open)
        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key === 'm') {
                e.preventDefault();
                modalOverlay.classList.add('active');
                searchBar.focus();
            }
        });

        // Initial render
        renderMacros(macros);

        // Expose addMacro to window for quick access
        window.addMacro = addMacro;
    </script>

</body>
</html>
